name: CI

on:
  pull_request:
  push:
    branches:
      - master

# One run at a time per commit. Pushing a stack of branches can raise two
# pull_request events for the same commit; the second waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  # Everything that doesn't depend on the Node.js or Bolt version, once.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The example's build reads its environment.
      - name: Setup example env
        run: cp examples/nextjs/.env.example examples/nextjs/.env.local

      # Fails when a package imports a file outside its directory or a package
      # it doesn't declare, which would break an example copied out of the repo.
      - name: Check package boundaries
        run: pnpm exec turbo boundaries

      # --continue reports every failure rather than stopping at the first.
      - name: Lint, typecheck, build, and check exported types
        run: pnpm exec turbo run lint typecheck build attw --continue=dependencies-successful

  # The library on every Node.js release line and Bolt major it supports.
  test:
    name: Node.js ${{ matrix.node }} / Bolt ${{ matrix.bolt }}.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        bolt: ["4", "5"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bolt 5 is the version in the lockfile. Bolt 4 is the oldest version the
      # peer range allows.
      - name: Install Bolt 4.7.3
        if: matrix.bolt == '4'
        run: pnpm --filter @vercel/slack-bolt add --save-dev @slack/bolt@4.7.3

      # Typechecks against this Bolt's types, then runs the tests.
      - name: Typecheck and test
        run: pnpm exec turbo run typecheck test --filter=@vercel/slack-bolt
