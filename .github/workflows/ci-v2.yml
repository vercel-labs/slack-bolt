name: CI v2

# Checks only the v2 receiver (packages/slack-bolt/src/index-v2*.ts). v1, the
# CLI and the examples are covered by ci.yml.
on:
  pull_request:
    branches:
      - v2
  push:
    branches:
      - v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/slack-bolt

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }} / Bolt ${{ matrix.slack-bolt }}.x
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
        slack-bolt: ["4", "5"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin @slack/bolt ${{ matrix.slack-bolt }}.x
        run: pnpm add -D "@slack/bolt@^${{ matrix.slack-bolt }}"

      - name: Lint
        run: pnpm exec oxlint src/index-v2*.ts && pnpm exec oxfmt --check src/index-v2*.ts

      # Typechecks the whole package, which includes the v2 sources and tests.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run src/index-v2

      - name: Build
        run: pnpm exec tsdown

      - name: Check exported types
        run: pnpm exec attw --pack . --entrypoints ./v2

      # Unit tests stub Bolt and attw doesn't run code, so load the built v2
      # entry for real and send it one request: its named imports from
      # CommonJS Bolt only resolve if Node's ESM loader detects them, and the
      # CommonJS build require()s ESM-only srvx.
      - name: Load built v2 entry
        run: |
          node -e "const { VercelReceiver } = require('./dist/index-v2.js'); new VercelReceiver({ signatureVerification: false }).fetch(new Request('http://x/any')).then((r) => { if (r.status !== 404) process.exit(1) })"
          node --input-type=module -e "const { VercelReceiver } = await import('./dist/index-v2.mjs'); const r = await new VercelReceiver({ signatureVerification: false }).fetch(new Request('http://x/any')); if (r.status !== 404) process.exit(1)"
