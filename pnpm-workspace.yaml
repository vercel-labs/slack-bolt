packages:
  - packages/*
  - examples/*
catalog:
  "@types/node": ^26.6.5
  oxfmt: 0.73.0
  oxlint: 1.88.0
  typescript: ~7.0.2
allowBuilds:
  esbuild: true
  sharp: true
# The examples depend on the published @vercel/slack-bolt, so a copied example
# installs from npm. Inside this repo, link them to packages/slack-bolt instead.
overrides:
  "@vercel/slack-bolt": "workspace:*"
